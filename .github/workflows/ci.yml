name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        # Misma imagen que en desarrollo (PostgreSQL 18 + pgvector, igual que Neon).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: tugrado
          POSTGRES_USER: tugrado
          POSTGRES_PASSWORD: cambia-esta-clave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tugrado -d tugrado"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      # Configuración de prueba: los valores de .env.example (sin secretos).
      - run: cp ../.env.example ../.env
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          BACKEND_URL: http://127.0.0.1:8000
