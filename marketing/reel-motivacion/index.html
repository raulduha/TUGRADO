<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-pregunta"
        class="frame"
        data-composition-id="01-pregunta"
        data-composition-src="compositions/frames/01-pregunta.html"
        data-start="0"
        data-duration="3.3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-espera"
        class="frame"
        data-composition-id="02-espera"
        data-composition-src="compositions/frames/02-espera.html"
        data-start="3.3"
        data-duration="3.36"
        data-track-index="1"
      ></div>

      <div
        id="el-03-ratito"
        class="frame"
        data-composition-id="03-ratito"
        data-composition-src="compositions/frames/03-ratito.html"
        data-start="6.66"
        data-duration="3.23"
        data-track-index="1"
      ></div>

      <div
        id="el-04-vuelve"
        class="frame"
        data-composition-id="04-vuelve"
        data-composition-src="compositions/frames/04-vuelve.html"
        data-start="9.89"
        data-duration="3.11"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio id="el-bgm" src="assets/bgm.mp3" data-start="0" data-duration="13"
        data-track-index="11" data-volume="0.9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
